name: build-windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # 태그(v0.7.0 …)로 올리면 GitHub Releases 에 설치 파일 + 업데이트 정보(latest.yml)를 올린다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      # 64비트: latest.yml  /  32비트: ia32.yml  (두 설치 파일이 서로의 업데이트 정보를 덮어쓰지 않게 채널을 나눈다)
      - name: build x64
        run: npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build ia32
        run: npx electron-builder --win --ia32 -c.publish.channel=ia32 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: evergreen-win-installers
          path: |
            dist/*.exe
            dist/*.yml
